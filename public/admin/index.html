<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrajetX - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink: #0c0c0e;
            --surface: #141417;
            --surface2: #1c1c21;
            --line: #26262c;
            --fg: #ececf1;
            --dim: #8b8b96;
            --faint: #55555e;
            --amber: #ffb300;
            --amber-dim: rgba(255, 179, 0, 0.15);
            --good: #4cd97b;
            --good-dim: rgba(76, 217, 123, 0.15);
            --bad: #ff5c5c;
            --bad-dim: rgba(255, 92, 92, 0.15);
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
        }
        body {
            font-family: 'Sora', system-ui, sans-serif;
            background: radial-gradient(1200px 500px at 50% -200px, rgba(255, 179, 0, 0.07), transparent 60%), var(--ink);
            color: var(--fg);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        /* Login */
        #loginPage { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--line);
        }
        .login-card h1 { 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 1.75rem;
            letter-spacing: -0.03em;
        }
        .login-card h1 span { color: var(--amber); }

        /* Dashboard */
        #dashboardPage { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .header h1 { 
            font-size: 1.5rem;
            letter-spacing: -0.03em;
        }
        .header h1 span { color: var(--amber); }
        .btn-logout {
            background: var(--bad);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-logout:hover { opacity: 0.9; }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--line);
        }
        .card h2 {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dim);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            color: var(--fg);
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
            min-height: 48px;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: rgba(255, 179, 0, 0.6);
        }
        .form-group input::placeholder { color: var(--faint); }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Buttons */
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            min-height: 48px;
        }
        .btn-primary { background: var(--amber); color: var(--ink); }
        .btn-success { background: var(--good); color: var(--ink); }
        .btn-danger { background: var(--bad); color: white; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; min-height: auto; }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }

        /* Prestations Table */
        .prestations-table { width: 100%; }
        .prestation-row {
            display: grid;
            grid-template-columns: 1fr 100px 80px 120px;
            gap: 12px;
            align-items: center;
            padding: 12px;
            background: var(--surface2);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            margin-bottom: 8px;
        }
        .prestation-row input {
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            color: var(--fg);
            font-family: inherit;
            font-size: 14px;
        }
        .prestation-row input:focus {
            outline: none;
            border-color: rgba(255, 179, 0, 0.6);
        }
        .prestation-row .actions { display: flex; gap: 8px; }
        .toggle-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }
        .toggle-btn.active { background: var(--good); color: var(--ink); }
        .toggle-btn.inactive { background: var(--bad); color: white; }

        /* Add prestation */
        .add-row {
            display: grid;
            grid-template-columns: 1fr 100px 100px;
            gap: 12px;
            margin-top: 16px;
        }
        .add-row input {
            padding: 14px;
            background: var(--surface2);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            color: var(--fg);
            font-family: inherit;
            font-size: 14px;
        }
        .add-row input:focus {
            outline: none;
            border-color: rgba(255, 179, 0, 0.6);
        }
        .add-row input::placeholder { color: var(--faint); }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .message.success { background: var(--good-dim); color: var(--good); }
        .message.error { background: var(--bad-dim); color: var(--bad); }

        /* Footer */
        footer a { color: var(--amber); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .prestation-row { grid-template-columns: 1fr; }
            .add-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage">
        <div class="login-card">
            <h1>Trajet<span>X</span> Admin</h1>
            <div id="loginError" class="message error" style="display: none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Identifiant</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Connexion</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboardPage">
        <div class="container">
            <header class="header">
                <h1>Trajet<span>X</span> Admin</h1>
                <button class="btn-logout" onclick="logout()">Deconnexion</button>
            </header>

            <div id="message" class="message" style="display: none;"></div>

            <!-- Compte Admin -->
            <div class="card">
                <h2>Compte Admin</h2>
                <form id="credentialsForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Identifiant</label>
                            <input type="text" id="adminUsername">
                        </div>
                        <div class="form-group">
                            <label>Nouveau mot de passe</label>
                            <input type="password" id="adminPassword" placeholder="Laisser vide pour ne pas changer">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Numero de telephone</label>
                        <input type="tel" id="adminPhone" placeholder="Ex: 06 12 34 56 78">
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>

            <!-- Tarifs -->
            <div class="card">
                <h2>Tarifs</h2>
                <form id="tarifsForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Prise en charge (EUR)</label>
                            <input type="number" step="0.01" id="priseEnCharge">
                        </div>
                        <div class="form-group">
                            <label>Prix au km (EUR)</label>
                            <input type="number" step="0.01" id="prixKm">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Majoration nuit (x)</label>
                            <input type="number" step="0.1" id="tarifNuit" placeholder="Ex: 1.5 = +50%">
                        </div>
                        <div class="form-group">
                            <label>Majoration weekend (x)</label>
                            <input type="number" step="0.1" id="tarifWeekend" placeholder="Ex: 1.3 = +30%">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>

            <!-- Prestations -->
            <div class="card">
                <h2>Prestations</h2>
                <div id="prestationsList" class="prestations-table"></div>
                <div class="add-row">
                    <input type="text" id="newPrestationNom" placeholder="Nom de la prestation">
                    <input type="number" step="0.01" id="newPrestationPrix" placeholder="Prix">
                    <button class="btn btn-success" onclick="addPrestation()">+ Ajouter</button>
                </div>
            </div>

            <footer style="text-align: center; padding: 20px; color: var(--dim);">
                <a href="../">Retour au site</a>
            </footer>
        </div>
    </div>

    <script>
        const API_BASE = '/trajetX/api';
        let token = localStorage.getItem('trajetx_token');
        let adminData = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                checkAuth();
            }
            setupForms();
        });

        async function checkAuth() {
            try {
                const res = await fetch(API_BASE + '/admin/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    showDashboard();
                } else {
                    logout();
                }
            } catch (e) {
                logout();
            }
        }

        function setupForms() {
            document.getElementById('loginForm').addEventListener('submit', login);
            document.getElementById('credentialsForm').addEventListener('submit', saveCredentials);
            document.getElementById('tarifsForm').addEventListener('submit', saveTarifs);
        }

        async function login(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_BASE + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const data = await res.json();

                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('trajetx_token', token);
                    showDashboard();
                } else {
                    showLoginError(data.error || 'Erreur de connexion');
                }
            } catch (e) {
                showLoginError('Erreur reseau');
            }
        }

        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function logout() {
            token = null;
            localStorage.removeItem('trajetx_token');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboardPage').style.display = 'none';
        }

        async function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
            await loadAdminData();
        }

        async function loadAdminData() {
            try {
                const res = await fetch(API_BASE + '/admin/data', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                adminData = await res.json();
                populateForm();
            } catch (e) {
                showMessage('Erreur chargement donnees', 'error');
            }
        }

        function populateForm() {
            document.getElementById('adminUsername').value = adminData.username || '';
            document.getElementById('adminPhone').value = adminData.phone || '';
            document.getElementById('priseEnCharge').value = adminData.tarifs.priseEnCharge || 0;
            document.getElementById('prixKm').value = adminData.tarifs.prixKm || 0;
            document.getElementById('tarifNuit').value = adminData.tarifs.tarifNuit || 1;
            document.getElementById('tarifWeekend').value = adminData.tarifs.tarifWeekend || 1;
            renderPrestations();
        }

        function renderPrestations() {
            const container = document.getElementById('prestationsList');
            container.innerHTML = adminData.prestations.map(function(p) {
                return '<div class="prestation-row" data-id="' + p.id + '">' +
                    '<input type="text" value="' + p.nom + '" onchange="updatePrestation(' + p.id + ', \'nom\', this.value)">' +
                    '<input type="number" step="0.01" value="' + p.prix + '" onchange="updatePrestation(' + p.id + ', \'prix\', this.value)">' +
                    '<button class="toggle-btn ' + (p.actif ? 'active' : 'inactive') + '" onclick="togglePrestation(' + p.id + ')">' +
                        (p.actif ? 'Actif' : 'Inactif') +
                    '</button>' +
                    '<div class="actions">' +
                        '<button class="btn btn-danger btn-small" onclick="deletePrestation(' + p.id + ')">Supprimer</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        async function saveCredentials(e) {
            e.preventDefault();
            const data = {
                username: document.getElementById('adminUsername').value,
                phone: document.getElementById('adminPhone').value
            };
            const password = document.getElementById('adminPassword').value;
            if (password) data.password = password;

            try {
                const res = await fetch(API_BASE + '/admin/credentials', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showMessage('Compte mis a jour!', 'success');
                    document.getElementById('adminPassword').value = '';
                }
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        async function saveTarifs(e) {
            e.preventDefault();
            const data = {
                priseEnCharge: parseFloat(document.getElementById('priseEnCharge').value),
                prixKm: parseFloat(document.getElementById('prixKm').value),
                tarifNuit: parseFloat(document.getElementById('tarifNuit').value),
                tarifWeekend: parseFloat(document.getElementById('tarifWeekend').value)
            };

            try {
                const res = await fetch(API_BASE + '/admin/tarifs', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showMessage('Tarifs enregistres!', 'success');
                }
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        async function updatePrestation(id, field, value) {
            const data = {};
            data[field] = field === 'prix' ? parseFloat(value) : value;

            try {
                await fetch(API_BASE + '/admin/prestations/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        async function togglePrestation(id) {
            const p = adminData.prestations.find(function(x) { return x.id === id; });
            if (!p) return;

            try {
                await fetch(API_BASE + '/admin/prestations/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ actif: !p.actif })
                });
                p.actif = !p.actif;
                renderPrestations();
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        async function deletePrestation(id) {
            if (!confirm('Supprimer cette prestation?')) return;

            try {
                await fetch(API_BASE + '/admin/prestations/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                adminData.prestations = adminData.prestations.filter(function(p) { return p.id !== id; });
                renderPrestations();
                showMessage('Prestation supprimee', 'success');
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        async function addPrestation() {
            const nom = document.getElementById('newPrestationNom').value.trim();
            const prix = parseFloat(document.getElementById('newPrestationPrix').value);

            if (!nom || isNaN(prix)) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            try {
                const res = await fetch(API_BASE + '/admin/prestations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nom: nom, prix: prix })
                });
                const newP = await res.json();
                adminData.prestations.push(newP);
                renderPrestations();
                document.getElementById('newPrestationNom').value = '';
                document.getElementById('newPrestationPrix').value = '';
                showMessage('Prestation ajoutee!', 'success');
            } catch (e) {
                showMessage('Erreur', 'error');
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
